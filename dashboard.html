<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Neo Client OS — Dashboard</title>
    <meta name="description" content="Neo Integrations client dashboard — your real estate sales command center." />
    <meta name="theme-color" content="#08080b" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="dashboard.css?v=contact1" />
  </head>
  <body class="dashboard-body">

    <!-- ═══ LAYOUT SHELL ═══ -->
    <div class="dash-layout">

      <!-- ── SIDEBAR ────────────────────────────────── -->
      <aside class="dash-sidebar" id="dash-sidebar">
        <div class="sidebar-brand">
          <div class="sidebar-logo"><svg viewBox="0 0 32 32" fill="currentColor" aria-hidden="true"><rect x="1.54" y="2.28" width="10.14" height="10.14" rx="3.85"/><rect x="12.14" y="13.31" width="9.89" height="9.89" rx="3.76"/><rect x="3.34" y="22.08" width="9.15" height="9.15" rx="3.48"/><rect x="22.06" y="22.19" width="8.65" height="8.65" rx="3.29"/><rect x="-7.56" y="-1.85" width="15.13" height="3.71" rx="1.85" transform="translate(11.85 12.80) rotate(46.14)"/><rect x="-6.22" y="-1.85" width="12.44" height="3.71" rx="1.85" transform="translate(12.50 22.46) rotate(137.51)"/><rect x="-6.22" y="-1.85" width="12.44" height="3.71" rx="1.85" transform="translate(21.74 22.38) rotate(41.60)"/></svg></div>
          <div class="sidebar-brand-text">
            <span class="sidebar-brand-name">Neo Client OS</span>
            <span class="sidebar-brand-client">Ira · Sales Operations</span>
          </div>
        </div>

        <nav class="sidebar-nav" id="sidebar-nav">
          <div class="sidebar-section-label">Operations</div>

          <button class="sidebar-nav-item active" data-section="overview" id="nav-overview">
            <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
            Overview
          </button>

          <button class="sidebar-nav-item" data-section="leads" id="nav-leads">
            <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
            Leads
            <span class="sidebar-badge warn">12</span>
          </button>

          <button class="sidebar-nav-item" data-section="visits" id="nav-visits">
            <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
            Site Visits
          </button>

          <button class="sidebar-nav-item" data-section="followups" id="nav-followups">
            <svg viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
            Follow-ups
          </button>

          <button class="sidebar-nav-item" data-section="escalations" id="nav-escalations">
            <svg viewBox="0 0 24 24"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
            Escalations
            <span class="sidebar-badge">4</span>
          </button>

          <div class="sidebar-section-label">Analytics</div>

          <button class="sidebar-nav-item" data-section="team" id="nav-team">
            <svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
            Team
          </button>

          <button class="sidebar-nav-item" data-section="channels" id="nav-channels">
            <svg viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
            Channels
          </button>

          <button class="sidebar-nav-item" data-section="briefing" id="nav-briefing">
            <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
            Briefing
          </button>

          <div class="sidebar-section-label">System</div>

          <button class="sidebar-nav-item" data-section="aihealth" id="nav-aihealth">
            <svg viewBox="0 0 24 24"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
            AI Health
          </button>

          <button class="sidebar-nav-item" data-section="settings" id="nav-settings">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
            Settings
          </button>
        </nav>

        <div class="sidebar-footer">
          <div class="sidebar-user" id="sidebar-user">
            <div class="sidebar-avatar" id="sidebar-avatar">CA</div>
            <div class="sidebar-user-info">
              <span class="sidebar-user-name" id="sidebar-username">Client Admin</span>
              <span class="sidebar-user-role">Admin</span>
            </div>
          </div>
          <button class="sidebar-nav-item" id="logout-btn" style="margin-top:4px; color: var(--dash-text-3);">
            <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
            Sign out
          </button>
        </div>
      </aside>

      <!-- ── MOBILE OVERLAY ─────────────────────────── -->
      <div class="mobile-sidebar-overlay" id="sidebar-overlay"></div>

      <!-- ── TOP BAR ────────────────────────────────── -->
      <header class="dash-topbar" id="dash-topbar">
        <div class="topbar-left">
          <button class="topbar-hamburger" id="topbar-hamburger">
            <svg viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
          </button>
          <span class="topbar-title" id="topbar-title">Overview</span>
        </div>
        <div class="topbar-right">
          <button class="topbar-search" id="topbar-search">
            <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <span class="topbar-search-text">Search leads…</span>
            <span class="topbar-search-kbd">⌘K</span>
          </button>
          <button class="topbar-icon-btn" id="notif-btn" title="Notifications">
            <svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
            <span class="topbar-notif-dot"></span>
          </button>
          <button class="topbar-avatar-btn" id="topbar-avatar" title="Account">CA</button>
        </div>
      </header>

      <!-- ── MAIN CONTENT AREA ──────────────────────── -->
      <main class="dash-main">
        <div class="dash-content" id="dash-content">
          <!-- Sections rendered by JS -->
        </div>
      </main>

    </div>

    <!-- ═══ LEAD DETAIL DRAWER ═══ -->
    <div class="drawer-overlay" id="drawer-overlay"></div>
    <div class="lead-drawer" id="lead-drawer">
      <div class="drawer-header">
        <div class="drawer-lead-info">
          <div class="drawer-lead-name" id="drawer-lead-name">Lead Name</div>
          <div class="drawer-lead-meta" id="drawer-lead-meta"></div>
        </div>
        <button class="drawer-close" id="drawer-close">
          <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="drawer-tabs" id="drawer-tabs">
        <button class="drawer-tab active" data-tab="conversation">Conversation</button>
        <button class="drawer-tab" data-tab="summary">Summary</button>
        <button class="drawer-tab" data-tab="timeline">Timeline</button>
        <button class="drawer-tab" data-tab="actions">Actions</button>
      </div>
      <div class="drawer-body" id="drawer-body"></div>
    </div>

    <!-- ═══ SCRIPTS ═══ -->
    <script src="dashboard-data.js"></script>
    <script src="dashboard-app.js"></script>
  </body>
</html>
