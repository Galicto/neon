<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" fill="none" aria-hidden="true">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="800" y2="560" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0a0a0f"/>
      <stop offset="1" stop-color="#050508"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="50%">
      <stop stop-color="#22d3ee" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="2"/></filter>
  </defs>
  <rect width="800" height="560" fill="url(#bg)"/>
  <rect width="800" height="560" fill="url(#glow)"/>
  <!-- Grid -->
  <g stroke="#1a1a24" stroke-width="0.5" opacity="0.6">
    <line x1="0" y1="140" x2="800" y2="140"/><line x1="0" y1="280" x2="800" y2="280"/>
    <line x1="0" y1="420" x2="800" y2="420"/>
    <line x1="160" y1="0" x2="160" y2="560"/><line x1="320" y1="0" x2="320" y2="560"/>
    <line x1="480" y1="0" x2="480" y2="560"/><line x1="640" y1="0" x2="640" y2="560"/>
  </g>
  <!-- Edges -->
  <g stroke="#22d3ee" stroke-width="1" opacity="0.2">
    <line x1="400" y1="100" x2="280" y2="180"/><line x1="400" y1="100" x2="520" y2="180"/>
    <line x1="280" y1="180" x2="180" y2="260"/><line x1="280" y1="180" x2="400" y2="260"/>
    <line x1="520" y1="180" x2="400" y2="260"/><line x1="520" y1="180" x2="620" y2="260"/>
    <line x1="180" y1="260" x2="260" y2="340"/><line x1="400" y1="260" x2="260" y2="340"/>
    <line x1="400" y1="260" x2="480" y2="340"/><line x1="620" y1="260" x2="540" y2="340"/>
    <line x1="260" y1="340" x2="340" y2="420"/><line x1="480" y1="340" x2="460" y2="420"/>
    <line x1="460" y1="340" x2="540" y2="340"/><line x1="340" y1="420" x2="460" y2="420"/>
  </g>
  <!-- Nodes -->
  <g>
    <circle cx="400" cy="100" r="14" fill="#22d3ee" opacity="0.9" filter="url(#blur)"/>
    <circle cx="400" cy="100" r="10" fill="#22d3ee"/>
    <circle cx="280" cy="180" r="10" fill="#22d3ee" opacity="0.85"/>
    <circle cx="520" cy="180" r="10" fill="#22d3ee" opacity="0.85"/>
    <circle cx="180" cy="260" r="9" fill="#22d3ee" opacity="0.75"/>
    <circle cx="400" cy="260" r="11" fill="#22d3ee"/>
    <circle cx="620" cy="260" r="9" fill="#22d3ee" opacity="0.75"/>
    <circle cx="260" cy="340" r="9" fill="#22d3ee" opacity="0.7"/>
    <circle cx="480" cy="340" r="9" fill="#22d3ee" opacity="0.7"/>
    <circle cx="540" cy="340" r="8" fill="#22d3ee" opacity="0.65"/>
    <circle cx="340" cy="420" r="9" fill="#22d3ee" opacity="0.7"/>
    <circle cx="460" cy="420" r="9" fill="#22d3ee" opacity="0.7"/>
  </g>
  <!-- Pulse dots -->
  <circle cx="340" cy="140" r="4" fill="#22d3ee" opacity="0.8">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="460" cy="300" r="4" fill="#22d3ee" opacity="0.8">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="380" cy="380" r="4" fill="#22d3ee" opacity="0.8">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="1.8s" repeatCount="indefinite"/>
  </circle>
</svg>
